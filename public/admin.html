<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin | Pequeños Sueños</title>
<link rel="stylesheet" href="admin.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="admin-container">

<h1>🧸 Panel Administrador</h1>

<div class="form">

<input id="nombre" placeholder="Nombre del producto">

<input id="precio" type="number" placeholder="Precio">

<select id="categoria">
<option value="">Seleccionar categoría</option>
<option value="bebe">Ropa de bebé</option>
<option value="nino">Ropa de niño</option>
<option value="accesorios">Accesorios</option>
</select>

<input id="stock" type="number" placeholder="Stock disponible">

<input id="imagen" placeholder="URL de imagen (opcional)">

<label>O subir imagen desde el celular</label>
<input id="imagenFile" type="file" accept="image/*">

<textarea id="descripcion" placeholder="Descripción del producto"></textarea>

<button onclick="agregar()">➕ Guardar producto</button>

</div>

<h2>Productos cargados</h2>

<div id="lista" class="productos-admin"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
